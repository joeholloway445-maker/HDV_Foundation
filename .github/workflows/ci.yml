name: CI

# Production-grade CI for HDV_Foundation (Big 5 Agent Matrix).
# Node/TypeScript backbone + Python personamatrix are validated independently.
# Any job failure fails the whole workflow (required for branch protection).

on:
  push:
    branches:
      - main
      - "cursor/**"
      - "feature/**"
      - "feat/**"
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node-version }} (typecheck + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  python:
    name: Python ${{ matrix.python-version }} (personamatrix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # personamatrix core is stdlib-only; install optional deps if any are pinned.
          if [ -s personamatrix/requirements.txt ] && grep -qvE '^\s*(#|$)' personamatrix/requirements.txt; then
            pip install -r personamatrix/requirements.txt
          fi

      - name: personamatrix demo
        run: python personamatrix/demo.py

      - name: Model backend tests
        run: python personamatrix/test_model_backend.py

      - name: Behavioral scoring
        run: python colab/03_behavioral_scoring.py
