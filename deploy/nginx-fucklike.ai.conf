# deploy/nginx-fucklike.ai.conf — FuckLike companion app on fucklike.ai
#
# Prerequisites (DNS):
#   Type A · Host fucklike · Value 31.97.98.79 · TTL 600
#   (or whatever your VPS IP is)
#
# Install on the Hostinger VPS:
#   cp deploy/nginx-fucklike.ai.conf /etc/nginx/sites-available/fucklike.ai
#   ln -sfn /etc/nginx/sites-available/fucklike.ai /etc/nginx/sites-enabled/
#   mkdir -p /var/www/fucklike.ai/public_html
#   cp -r fucklike/web/* /var/www/fucklike.ai/public_html/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d fucklike.ai --redirect
#
# The app talks same-origin to /v1/ (proxied to the HDV gateway on 127.0.0.1:8787).

server {
    listen 80;
    listen [::]:80;
    server_name fucklike.ai;

    root /var/www/fucklike.ai/public_html;
    index index.html;

    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
