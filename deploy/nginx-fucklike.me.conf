# deploy/nginx-fucklike.me.conf — FuckLike creator marketplace on fucklike.me
#
# Prerequisites (DNS):
#   Type A · Host fucklike (subdomain .me) · Value 31.97.98.79 · TTL 600
#   (or whatever your VPS IP is)
#
# Install on the Hostinger VPS:
#   cp deploy/nginx-fucklike.me.conf /etc/nginx/sites-available/fucklike.me
#   ln -sfn /etc/nginx/sites-available/fucklike.me /etc/nginx/sites-enabled/
#   mkdir -p /var/www/fucklike.me/public_html
#   # Placeholder until creator marketplace web app is deployed
#   echo '<h1>FuckLike Creator Marketplace</h1><p>Coming soon...</p>' > /var/www/fucklike.me/public_html/index.html
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d fucklike.me --redirect
#
# The app (when built) talks same-origin to /v1/ (proxied to the HDV gateway on 127.0.0.1:8787).

server {
    listen 80;
    listen [::]:80;
    server_name fucklike.me;

    root /var/www/fucklike.me/public_html;
    index index.html;

    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
