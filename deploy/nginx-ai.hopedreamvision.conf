# deploy/nginx-ai.hopedreamvision.conf — HOPE web app on ai.hopedreamvision.com
#
# Prerequisites (GoDaddy DNS):
#   Type A · Host ai · Value 31.97.98.79 · TTL 600
#
# Install on the Hostinger VPS:
#   cp deploy/nginx-ai.hopedreamvision.conf /etc/nginx/sites-available/ai.hopedreamvision
#   ln -sfn /etc/nginx/sites-available/ai.hopedreamvision /etc/nginx/sites-enabled/
#   mkdir -p /var/www/ai.hopedreamvision.com/public_html
#   cp marketing/app.html /var/www/ai.hopedreamvision.com/public_html/index.html
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ai.hopedreamvision.com --redirect
#
# The app talks same-origin to /v1/ (proxied to the HDV gateway on 127.0.0.1:8787).

server {
    listen 80;
    listen [::]:80;
    server_name ai.hopedreamvision.com;

    root /var/www/ai.hopedreamvision.com/public_html;
    index index.html;

    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
