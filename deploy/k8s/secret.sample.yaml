# deploy/k8s/secret.sample.yaml — SECRET gateway configuration (sample; DO NOT COMMIT real values).
#
# This is a template. In a real cluster, DO NOT store plaintext secrets in git — create the
# Secret out-of-band or via a sealed-secrets / external-secrets operator, e.g.:
#
#   kubectl -n hdv-foundation create secret generic hdv-gateway-secrets \
#     --from-literal=HDV_API_KEY='...' \
#     --from-literal=DATABASE_URL='postgresql://big5:...@postgres:5432/big5_matrix?schema=public' \
#     --from-literal=REDIS_URL='redis://redis:6379'
#
# `stringData` lets you paste plaintext for local/dev clusters; Kubernetes base64-encodes it.
apiVersion: v1
kind: Secret
metadata:
  name: hdv-gateway-secrets
  namespace: hdv-foundation
  labels:
    app.kubernetes.io/part-of: big5-matrix
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  # Edge API key the HOPE gateway enforces (see gateway/ auth middleware).
  HDV_API_KEY: "replace-me-with-a-long-random-key"
  # Durable persistence behind the Prisma repository seam.
  DATABASE_URL: "postgresql://big5:replace-me@postgres:5432/big5_matrix?schema=public"
  # Backing for leases (nodes/lease.ts RedisLeaseStub) and the shared rate limiter.
  REDIS_URL: "redis://redis:6379"
  # Optional key for the shared LLM server, if it requires one.
  HDV_LLM_API_KEY: ""
