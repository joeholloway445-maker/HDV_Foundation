# deploy/docker-compose.prod.yml — production stack for the HDV Foundation HOPE gateway.
#
# What it runs:
#   gateway    the always-on HOPE HTTP API (node:http, no framework) — the ONLY public-facing
#              process, bound to 127.0.0.1:8787 so a reverse proxy (Caddy/nginx) terminates TLS.
#   postgres   durable persistence behind the Prisma repository seam (createRepositories('prisma')).
#   redis      backing for the router / rate-limit / task-queue stubs.
#   ollama     (OPTIONAL, `--profile local-llm`) a local OpenAI-compatible LLM on the same box.
#   kokoro-tts (OPTIONAL, `--profile tts`) a local self-hosted Kokoro-82M TTS server on the same
#              box — see colab/10_kokoro_tts_server.md. CPU-inference-capable, unlike the
#              GPU-bound image/video models, so it runs as a same-box sidecar just like ollama.
#
# Nothing except the gateway is published to the host, and the gateway is published only on
# loopback. Postgres/Redis/Ollama/kokoro-tts are reachable only on the internal Docker network.
# This keeps the "single legal road" principle at the network layer: no side door into the matrix.
#
# Usage (from big5-matrix/):
#   cp .env.example .env         # set HDV_API_KEY, DATABASE_URL, REDIS_URL (see deploy/HOSTINGER.md §5)
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#   docker compose -f deploy/docker-compose.prod.yml exec gateway npm run db:push   # first boot
#
# Optional local LLM (co-located inference, no vendor key leaves the box):
#   docker compose -f deploy/docker-compose.prod.yml --profile local-llm up -d
#   # then in .env: HDV_LLM_PROVIDER=openai_compatible
#   #               HDV_LLM_BASE_URL=http://ollama:11434/v1   HDV_LLM_MODEL=llama3.2:3b
#   # (companion/chat wants a roleplay-capable model instead — see deploy/OLLAMA.md §6)
#
# Optional local TTS (co-located Kokoro-82M speech synthesis, no vendor key leaves the box):
#   docker compose -f deploy/docker-compose.prod.yml --profile tts up -d
#   # then in .env: HDV_TTS_PROVIDER=kokoro_tunnel
#   #               HDV_TTS_BASE_URL=http://kokoro-tts:8880
#   # (see colab/10_kokoro_tts_server.md for the exact image/port — verify against the
#   #  remsky/Kokoro-FastAPI README before going live)

services:
  gateway:
    build:
      # build context is the repo (big5-matrix/); Dockerfile lives in deploy/
      context: ..
      dockerfile: deploy/Dockerfile
    image: hdv-foundation/gateway:latest
    container_name: hdv-gateway
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Gateway binds this port inside the container; only loopback is published below.
      PORT: 8787
      # Inside the container listen on all interfaces; compose still publishes ONLY 127.0.0.1:8787
      # on the host. Binding 127.0.0.1 inside Docker makes the published port unreachable.
      HDV_BIND_HOST: "0.0.0.0"
      # In-container service names override any localhost URLs from .env:
      DATABASE_URL: "postgresql://big5:${POSTGRES_PASSWORD:-big5}@postgres:5432/big5_matrix?schema=public"
      REDIS_URL: "redis://redis:6379"
      # Host .env points workers at 127.0.0.1:11434; inside the gateway use Docker DNS.
      HDV_LLM_BASE_URL: "http://ollama:11434/v1"
      PERSONAMATRIX_OLLAMA_URL: "http://ollama:11434"
      HDV_PERSONA_INFERENCE: "1"
      PERSONAMATRIX_BACKEND: "ollama"
    ports:
      # loopback only — the reverse proxy (host) forwards 443 -> 127.0.0.1:8787
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /v1/health is always public (auth- and rate-limit-exempt)
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: hdv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: big5
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-big5}
      POSTGRES_DB: big5_matrix
    # NOT published to the host — internal Docker network only.
    expose:
      - "5432"
    volumes:
      - hdv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U big5 -d big5_matrix"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: hdv-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - hdv_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional co-located local LLM. Enable with: --profile local-llm
  # Serves an OpenAI-compatible API at http://ollama:11434/v1 on the internal network.
  ollama:
    image: ollama/ollama:latest
    container_name: hdv-ollama
    profiles: ["local-llm"]
    restart: unless-stopped
    # Loopback only — never publicly reachable. Host workers + gateway (via service DNS) share it.
    ports:
      - "127.0.0.1:11434:11434"
    expose:
      - "11434"
    volumes:
      - hdv_ollama:/root/.ollama
    # Uncomment on a GPU host with the NVIDIA container toolkit installed:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Optional co-located self-hosted TTS. Enable with: --profile tts
  # remsky/Kokoro-FastAPI — an OpenAI-compatible /v1/audio/speech wrapper around Kokoro-82M
  # (Apache-2.0, ~82M params, CPU-inference-capable). See colab/10_kokoro_tts_server.md for the
  # verified image tag / run command / port before going live — the values below are the
  # documented defaults as of this writing and should be reconfirmed against that project's
  # current README.
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: hdv-kokoro-tts
    profiles: ["tts"]
    restart: unless-stopped
    # Loopback only — never publicly reachable, same posture as ollama above. The gateway
    # reaches it via Docker service DNS (http://kokoro-tts:8880), not this published port.
    ports:
      - "127.0.0.1:8880:8880"
    expose:
      - "8880"
    # Uncomment on a GPU host with the NVIDIA container toolkit installed, and swap the image
    # above for ghcr.io/remsky/kokoro-fastapi-gpu:latest — Kokoro-82M runs comfortably on CPU
    # though, so this is optional, unlike the SDXL/LingBot image/video models.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  hdv_pgdata:
  hdv_redisdata:
  hdv_ollama:
