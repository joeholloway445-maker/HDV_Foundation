<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HopeDreamVision — App</title>
<meta name="description" content="Talk to HOPE through the HDV Foundation gateway." />
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,900&family=Sora:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --void: #05070f;
    --deep: #090d1c;
    --ink: #eef1fb;
    --ink-soft: rgba(238, 241, 251, 0.72);
    --ink-faint: rgba(238, 241, 251, 0.42);
    --amber: #ffce7a;
    --amber-deep: #f0a541;
    --aqua: #6ee7d0;
    --ok: #6ee7d0;
    --warn: #ffce7a;
    --bad: #f08a7d;
    --line: rgba(255, 206, 122, 0.22);
    --line-soft: rgba(238, 241, 251, 0.10);
    --panel: rgba(9, 13, 28, 0.72);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    color: var(--ink);
    font-family: 'Sora', ui-sans-serif, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    background:
      radial-gradient(50% 40% at 15% 0%, rgba(240, 165, 65, 0.22), transparent 60%),
      radial-gradient(45% 35% at 90% 5%, rgba(47, 185, 168, 0.18), transparent 55%),
      linear-gradient(165deg, var(--void), var(--deep));
    -webkit-font-smoothing: antialiased;
  }
  .app {
    min-height: 100%;
    max-width: 760px;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 0 clamp(1rem, 3vw, 1.5rem);
  }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; padding: 1rem 0 0.75rem;
  }
  .brand {
    text-decoration: none; color: inherit;
    font-family: 'Fraunces', serif; font-weight: 900;
    font-size: 1.25rem; letter-spacing: -0.02em;
    background: linear-gradient(165deg, var(--amber), var(--amber-deep));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .status {
    display: inline-flex; align-items: center; gap: 0.45rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  .status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--warn);
    box-shadow: 0 0 0 0 rgba(255, 206, 122, 0.45);
    animation: pulse 2.4s ease-out infinite;
  }
  .status.online .dot { background: var(--ok); box-shadow: 0 0 0 0 rgba(110, 231, 208, 0.45); }
  .status.offline .dot { background: var(--bad); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(110, 231, 208, 0.45); }
    70% { box-shadow: 0 0 0 10px rgba(110, 231, 208, 0); }
    100% { box-shadow: 0 0 0 0 rgba(110, 231, 208, 0); }
  }
  .top-actions { display: flex; align-items: center; gap: 0.85rem; }
  .top-actions button, .top-actions a {
    background: none; border: 0; padding: 0; cursor: pointer;
    font: inherit; font-size: 0.82rem; color: var(--ink-soft); text-decoration: none;
  }
  .top-actions button:hover, .top-actions a:hover { color: var(--amber); }

  .thread {
    overflow-y: auto;
    padding: 1rem 0 1.25rem;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .welcome {
    margin: auto 0;
    padding: 2rem 0 3rem;
    opacity: 0; transform: translateY(14px);
    animation: rise 0.85s cubic-bezier(.2,.7,.2,1) .08s forwards;
  }
  .welcome h1 {
    margin: 0 0 0.6rem;
    font-family: 'Fraunces', serif;
    font-weight: 500; font-style: italic;
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    letter-spacing: -0.015em;
  }
  .welcome p { margin: 0; color: var(--ink-soft); max-width: 36ch; }
  .welcome .hints {
    display: flex; flex-wrap: wrap; gap: 0.5rem;
    margin-top: 1.4rem;
  }
  .welcome .hints button {
    border: 1px solid var(--line-soft);
    background: transparent; color: var(--ink-soft);
    border-radius: 999px; padding: 0.45rem 0.85rem;
    font: inherit; font-size: 0.8rem; cursor: pointer;
    transition: border-color .2s, color .2s;
  }
  .welcome .hints button:hover { border-color: var(--line); color: var(--amber); }

  .msg {
    max-width: 92%;
    opacity: 0; transform: translateY(10px);
    animation: rise 0.45s ease forwards;
  }
  .msg.user { align-self: flex-end; }
  .msg.hope { align-self: flex-start; }
  .msg .who {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 0.3rem;
  }
  .msg.user .who { text-align: right; }
  .msg .bubble {
    padding: 0.85rem 1rem;
    border-radius: 16px;
    background: rgba(238, 241, 251, 0.04);
    border: 1px solid var(--line-soft);
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble {
    background: linear-gradient(165deg, rgba(255,206,122,0.16), rgba(240,165,65,0.08));
    border-color: var(--line);
  }
  .msg .meta {
    margin-top: 0.45rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem; color: var(--ink-faint);
    display: flex; flex-wrap: wrap; gap: 0.45rem 0.8rem;
  }
  .pill {
    display: inline-block; padding: 0.1rem 0.45rem; border-radius: 999px;
    border: 1px solid var(--line-soft);
  }
  .pill.ok { color: var(--ok); border-color: rgba(110,231,208,0.35); }
  .pill.warn { color: var(--warn); border-color: rgba(255,206,122,0.35); }
  .pill.bad { color: var(--bad); border-color: rgba(240,138,125,0.35); }

  .composer-wrap {
    position: sticky; bottom: 0;
    padding: 0.4rem 0 1.1rem;
    background: linear-gradient(180deg, transparent, rgba(5,7,15,0.92) 28%);
  }
  .composer {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.65rem;
    align-items: end;
    padding: 0.75rem;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--panel);
    backdrop-filter: blur(12px);
  }
  textarea {
    width: 100%; min-height: 52px; max-height: 160px; resize: none;
    border: 0; outline: none; background: transparent;
    color: var(--ink); font: inherit; padding: 0.35rem 0.4rem;
  }
  .send {
    border: 0; cursor: pointer;
    color: #17130a; font: inherit; font-weight: 600; font-size: 0.88rem;
    padding: 0.7rem 1.1rem; border-radius: 999px;
    background: linear-gradient(180deg, var(--amber), var(--amber-deep));
    transition: transform .2s, opacity .2s;
  }
  .send:hover:not(:disabled) { transform: translateY(-1px); }
  .send:disabled { opacity: 0.45; cursor: default; }
  .composer-note {
    margin: 0.45rem 0.2rem 0;
    font-size: 0.72rem; color: var(--ink-faint);
    display: flex; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;
  }
  .composer-note a { color: var(--amber); text-decoration: none; }

  dialog {
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--deep);
    color: var(--ink);
    padding: 1.4rem;
    width: min(420px, calc(100vw - 2rem));
  }
  dialog::backdrop { background: rgba(5, 7, 15, 0.72); }
  dialog h2 {
    margin: 0 0 0.4rem;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.25rem;
  }
  dialog p { margin: 0 0 1rem; color: var(--ink-soft); font-size: 0.9rem; }
  dialog input {
    width: 100%;
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    background: rgba(5,7,15,0.55);
    color: var(--ink); font: inherit;
    padding: 0.7rem 0.8rem;
  }
  dialog .row { display: flex; gap: 0.6rem; margin-top: 1rem; justify-content: flex-end; }
  dialog .row button {
    border-radius: 999px; padding: 0.55rem 1rem; font: inherit; cursor: pointer;
  }
  dialog .ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  dialog .primary {
    border: 0; color: #17130a; font-weight: 600;
    background: linear-gradient(180deg, var(--amber), var(--amber-deep));
  }

  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .welcome, .msg { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="top">
      <a class="brand" href="index.html">HopeDreamVision</a>
      <div class="top-actions">
        <span class="status" id="status"><span class="dot" aria-hidden="true"></span><span id="status-text">connecting</span></span>
        <button type="button" id="open-settings">Key</button>
        <a href="waitlist.html">Waitlist</a>
      </div>
    </header>

    <div class="thread" id="thread" aria-live="polite">
      <div class="welcome" id="welcome">
        <h1>Talk to HOPE.</h1>
        <p>Say what you need. HOPE interprets, APEX routes, KNOLL gates — one road through the matrix.</p>
        <div class="hints">
          <button type="button" data-hint="Simulate three launch outcomes for a product.">Simulate outcomes</button>
          <button type="button" data-hint="What can HDV Foundation do for me right now?">What can you do?</button>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="form">
        <textarea id="utterance" rows="2" placeholder="Ask HOPE…" required></textarea>
        <button class="send" id="send" type="submit">Send</button>
      </form>
      <div class="composer-note">
        <span id="key-note">Add your HDV API key to send.</span>
        <span>⌘/Ctrl + Enter</span>
      </div>
    </div>
  </div>

  <dialog id="settings">
    <h2>Access key</h2>
    <p>Stored only in this browser. Needed for <code>/v1/intent</code> on the live gateway.</p>
    <input id="api-key" type="password" autocomplete="off" placeholder="HDV API key" />
    <div class="row">
      <button type="button" class="ghost" id="clear-key">Clear</button>
      <button type="button" class="primary" id="save-key">Save</button>
    </div>
  </dialog>

<script type="module">
  const API = (new URLSearchParams(location.search).get('api') || '').replace(/\/+$/, '') || location.origin;
  const KEY_STORE = 'hdv.apiKey';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function getKey() {
    return (localStorage.getItem(KEY_STORE) || '').trim();
  }
  function setKey(v) {
    const t = (v || '').trim();
    if (t) localStorage.setItem(KEY_STORE, t);
    else localStorage.removeItem(KEY_STORE);
    refreshKeyNote();
  }
  function refreshKeyNote() {
    $('key-note').innerHTML = getKey()
      ? 'Connected with a local key.'
      : 'Add your HDV API key to send. <a href="waitlist.html">Need access?</a>';
  }

  async function api(path, init = {}) {
    const headers = { ...(init.headers || {}) };
    const key = getKey();
    if (key) headers['X-HDV-Key'] = key;
    const res = await fetch(API + path, { ...init, headers });
    const text = await res.text();
    let body;
    try { body = text ? JSON.parse(text) : undefined; } catch { body = { error: text }; }
    return { ok: res.ok, status: res.status, body };
  }

  function setStatus(mode, text) {
    const el = $('status');
    el.classList.remove('online', 'offline');
    if (mode) el.classList.add(mode);
    $('status-text').textContent = text;
  }

  function hideWelcome() {
    const w = $('welcome');
    if (w) w.remove();
  }

  function addMessage({ who, text, metaHtml }) {
    hideWelcome();
    const div = document.createElement('div');
    div.className = 'msg ' + (who === 'You' ? 'user' : 'hope');
    div.innerHTML =
      '<div class="who">' + esc(who) + '</div>' +
      '<div class="bubble">' + esc(text) + '</div>' +
      (metaHtml ? '<div class="meta">' + metaHtml + '</div>' : '');
    $('thread').appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  function pill(cls, label) {
    return '<span class="pill ' + cls + '">' + esc(label) + '</span>';
  }

  async function sendIntent(utterance) {
    const text = utterance.trim();
    if (!text) return;
    if (!getKey()) {
      $('settings').showModal();
      return;
    }
    addMessage({ who: 'You', text });
    $('utterance').value = '';
    $('send').disabled = true;
    try {
      const { ok, status, body } = await api('/v1/intent', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ utterance: text }),
      });
      if (!ok) {
        addMessage({
          who: 'HOPE',
          text: (body && (body.error || body.hint)) || ('Request failed (' + status + ')'),
          metaHtml: pill('bad', 'ERROR'),
        });
        if (status === 401 || status === 403) $('settings').showModal();
        return;
      }
      const route = body.routingStatus || (body.clarificationNeeded ? 'HELD' : 'ACCEPTED');
      const cls = route === 'SUCCESS' ? 'ok' : route === 'BLOCKED' ? 'bad' : 'warn';
      const bits = [pill(cls, route)];
      if (body.enrichment && body.enrichment.source) {
        bits.push(esc(body.enrichment.source) + (body.enrichment.model ? ' · ' + esc(body.enrichment.model) : ''));
      }
      if (body.intent && body.intent.suggestedDestination) {
        bits.push('→ ' + esc(body.intent.suggestedDestination));
      }
      addMessage({
        who: 'HOPE',
        text: body.voice || 'Request received.',
        metaHtml: bits.join(''),
      });
    } catch (err) {
      addMessage({ who: 'HOPE', text: String(err), metaHtml: pill('bad', 'ERROR') });
    } finally {
      $('send').disabled = false;
      $('utterance').focus();
    }
  }

  async function pollHealth() {
    try {
      const { ok, body } = await api('/v1/health');
      if (!ok) { setStatus('offline', 'offline'); return; }
      const gate = body.knollGate || 'unknown';
      setStatus('online', 'online · ' + gate);
    } catch {
      setStatus('offline', 'offline');
    }
  }

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    sendIntent($('utterance').value);
  });
  $('utterance').addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      sendIntent($('utterance').value);
    }
  });
  document.querySelectorAll('[data-hint]').forEach((btn) => {
    btn.addEventListener('click', () => {
      $('utterance').value = btn.getAttribute('data-hint') || '';
      $('utterance').focus();
    });
  });

  $('open-settings').addEventListener('click', () => {
    $('api-key').value = getKey();
    $('settings').showModal();
  });
  $('save-key').addEventListener('click', () => {
    setKey($('api-key').value);
    $('settings').close();
  });
  $('clear-key').addEventListener('click', () => {
    $('api-key').value = '';
    setKey('');
    $('settings').close();
  });

  refreshKeyNote();
  pollHealth();
  setInterval(pollHealth, 8000);
</script>
</body>
</html>
