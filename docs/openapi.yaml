openapi: 3.0.3
info:
  title: Big 5 Matrix (HDV Foundation) — HOPE Gateway API
  version: "0.8.0"
  description: >
    The public HTTP surface of the Big 5 Matrix. Every request enters through the HOPE gateway,
    is minted into a RoutingPacket by APEX, and is gated by KNOLL before any DREAM/VISION work
    runs. This document covers the main `/v1` routes. It is the contract the typed SDK
    (`@big5-matrix/sdk`) and the live HOPE app are built against. Clients import NO agent
    internals — they only speak HTTP to these routes.
  license:
    name: MIT
servers:
  - url: http://localhost:8787
    description: Local gateway (npm run gateway)
tags:
  - name: intent
  - name: health
  - name: metrics
  - name: billing
  - name: auth
  - name: waitlist
  - name: companion
  - name: creator
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Optional API key sent as `Authorization: Bearer <token>`.
  parameters:
    TenantHeader:
      name: X-HDV-Tenant
      in: header
      required: false
      schema:
        type: string
      description: Tenant identifier for tenant-scoped routes (defaults to "demo").
    SessionHeader:
      name: X-HDV-Session
      in: header
      required: false
      schema:
        type: string
      description: >-
        Bearer session token minted by POST /v1/auth/signup or /v1/auth/login. Required (401
        otherwise) for GET /v1/auth/me; POST /v1/auth/logout also accepts it in a
        `{ sessionToken }` JSON body as a fallback. Also REQUIRED (401 otherwise) for every
        client-facing /v1/creator/* route (apply, persona, earnings, verification, payout) —
        UNLIKE /v1/auth/me, those routes are also NOT exempt from `bearerAuth` (the operator's
        HDV_API_KEY), so both may be required together. The ONE exception is
        POST /v1/creator/webhooks/stripe, which Stripe itself calls and which carries NEITHER
        this header nor an API key — see that route's own description for its (different)
        security model.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    KnollVerdict:
      type: object
      properties:
        isAllowed:
          type: boolean
        reasoning:
          type: string
          nullable: true
        enforcedConstraints:
          type: array
          items:
            type: string
          description: >
            Public law/guard names, e.g. NO_DIRECT_DREAM_VISION, HASH_INTEGRITY, NO_CROSS_TENANT.
    IntentRequest:
      type: object
      properties:
        utterance:
          type: string
          description: The natural-language request to interpret and route.
      required: [utterance]
    IntentResponse:
      type: object
      properties:
        accepted:
          type: boolean
        dispatched:
          type: boolean
        clarificationNeeded:
          type: boolean
        routingStatus:
          type: string
          enum: [SUCCESS, BLOCKED, FAILED, HELD]
        knoll:
          allOf:
            - $ref: '#/components/schemas/KnollVerdict'
          nullable: true
        voice:
          type: string
        intent:
          type: object
          additionalProperties: true
        documentId:
          type: string
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        time:
          type: integer
          format: int64
        alwaysOn:
          type: array
          items:
            type: object
            properties:
              role: { type: string }
              lifecycle: { type: string }
              status: { type: string }
        ephemeral:
          type: array
          items:
            type: object
            properties:
              role: { type: string }
              lifecycle: { type: string }
              idle: { type: boolean }
              lastActiveAgoMs:
                type: integer
                nullable: true
        knollGate:
          type: string
    DeepCheckResult:
      type: object
      description: >
        One dependency's reachability result from GET /v1/health/deep. `skipped: true` means no
        probe ran (the dependency isn't configured, or — for google_ai_studio images — no cheap
        probe exists) and is NEVER a failure; `ok` is only meaningful when `skipped` is false.
      properties:
        configured:
          type: boolean
          description: Whether this dependency has any configuration at all.
        skipped:
          type: boolean
          description: True when no reachability probe ran (unconfigured, or no cheap probe exists).
        ok:
          type: boolean
          description: Meaningful only when skipped is false — whether the probe reached the dependency.
        detail:
          type: string
          nullable: true
        latencyMs:
          type: number
          nullable: true
      required: [configured, skipped, ok]
    HealthDeepResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: True only if every CONFIGURED, non-skipped dependency reported ok.
        checks:
          type: object
          properties:
            postgres: { $ref: '#/components/schemas/DeepCheckResult' }
            redis: { $ref: '#/components/schemas/DeepCheckResult' }
            llm: { $ref: '#/components/schemas/DeepCheckResult' }
            image: { $ref: '#/components/schemas/DeepCheckResult' }
            video: { $ref: '#/components/schemas/DeepCheckResult' }
          required: [postgres, redis, llm, image, video]
        timestamp:
          type: string
          format: date-time
      required: [ok, checks, timestamp]
    WaitlistSignupRequest:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: string }
        company: { type: string }
        interestedTier: { type: string }
        useCase: { type: string }
        source: { type: string }
        referral: { type: string }
      required: [email]
    WaitlistSignupResponse:
      type: object
      properties:
        created: { type: boolean }
        duplicate: { type: boolean }
        position: { type: integer }
        entry:
          type: object
          additionalProperties: true
    WaitlistStats:
      type: object
      properties:
        total: { type: integer }
        bySource:
          type: object
          additionalProperties: { type: integer }
        byTier:
          type: object
          additionalProperties: { type: integer }
        last24h: { type: integer }
        last7d: { type: integer }
        firstAt: { type: integer, nullable: true }
        lastAt: { type: integer, nullable: true }
    User:
      type: object
      description: Public-safe account view. NEVER includes passwordHash.
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
      required: [userId, email]
    AuthSignupRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 8
          description: Minimum 8 characters. No other complexity rules in this pass.
      required: [email, password]
    AuthLoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]
    AuthResponse:
      type: object
      description: Returned by both signup and login. Never includes the password or its hash.
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        sessionToken:
          type: string
          description: Opaque bearer token — send back via the X-HDV-Session header.
      required: [userId, email, sessionToken]
    AuthLogoutRequest:
      type: object
      description: Optional fallback body when the X-HDV-Session header isn't used.
      properties:
        sessionToken: { type: string }
    CompanionPersona:
      type: object
      properties:
        name: { type: string }
        age:
          type: integer
          minimum: 18
          description: Required. Chat is refused (400) for any persona under 18, regardless of provider.
        personality:
          type: string
          enum: [playful, romantic, bratty, dominant, soft, mysterious]
        backstory: { type: string }
        intensity:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: How explicit/raunchy replies may get, 1 (sweet/PG) to 5 (maximally explicit). Clamped; malformed values default to 3.
        adherence:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: How strictly replies stick to the character sheet, 1 (loose improvisation) to 5 (strict script). Also drives LLM sampling temperature. Clamped; malformed values default to 3.
      required: [name, age]
    CompanionChatMessage:
      type: object
      properties:
        role: { type: string, enum: [user, bot] }
        text: { type: string }
      required: [role, text]
    CompanionChatRequest:
      type: object
      properties:
        persona:
          $ref: '#/components/schemas/CompanionPersona'
        history:
          type: array
          items:
            $ref: '#/components/schemas/CompanionChatMessage'
          description: Trimmed transcript so far (last ~20 turns). Stateless — sent every call.
        message:
          type: string
        companionId:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: >
            Optional, ENTIRELY OPT-IN. An opaque, client-generated stable id for "which saved
            companion is this" — NOT a real user id (there is no user-account system yet).
            Alphanumeric plus "_"/"-" only. When present AND persistent memory is available
            server-side, the companion's remembered relationship state (see CompanionMemory) is
            folded into the reply and updated afterward. Omitted ⇒ chat is fully stateless, byte-
            for-byte identical to calling this endpoint with no memory feature at all.
      required: [persona, message]
    CompanionChatResponse:
      type: object
      properties:
        reply:
          type: string
        source:
          type: string
          enum: [llm, fallback]
          description: llm when HDV_LLM_PROVIDER produced the reply; fallback when it was canned.
        model:
          type: string
          nullable: true
      required: [reply, source]
    CompanionMemory:
      type: object
      description: >
        Opt-in companion relationship memory (companion/memory.ts). One row per companionId.
        Never 404s from GET /v1/companion/memory — an unknown companionId simply returns these
        defaults (affectionLevel 50, empty summary, turnCount 0).
      properties:
        companionId:
          type: string
        affectionLevel:
          type: integer
          minimum: 0
          maximum: 100
          default: 50
        summary:
          type: string
          description: Running relationship/fact summary, length-capped.
        turnCount:
          type: integer
          default: 0
        updatedAt:
          type: integer
          description: Epoch milliseconds.
      required: [companionId, affectionLevel, summary, turnCount, updatedAt]
    PortraitPersona:
      type: object
      properties:
        name: { type: string }
        age:
          type: integer
          minimum: 18
          description: Required. Portraits are refused (400) for any persona under 18, regardless of provider.
        style: { type: string, description: 'Free-form visual style, e.g. "realistic" or "anime".' }
        personality:
          type: string
          enum: [playful, romantic, bratty, dominant, soft, mysterious]
        appearance: { type: string, description: 'Optional physical-appearance descriptor (hair, build, etc.) folded into the image prompt.' }
        backstory: { type: string }
      required: [name, age]
    PortraitRequest:
      type: object
      properties:
        persona:
          $ref: '#/components/schemas/PortraitPersona'
      required: [persona]
    PortraitResponse:
      type: object
      properties:
        image:
          type: string
          nullable: true
          description: A `data:<mimeType>;base64,<bytes>` URI, or null when unavailable.
        source:
          type: string
          description: The provider name on success (e.g. google_ai_studio, colab_tunnel), or "unavailable".
        model:
          type: string
          nullable: true
        error:
          type: string
          description: Present only when source is "unavailable" due to a real provider failure.
      required: [image, source]
    SceneRequest:
      type: object
      properties:
        persona:
          type: object
          properties:
            name: { type: string }
            age:
              type: integer
              minimum: 18
              description: Required. Scenes are refused (400) for any persona under 18, regardless of provider.
            personality:
              type: string
              enum: [playful, romantic, bratty, dominant, soft, mysterious]
            appearance: { type: string, description: 'Optional physical-appearance descriptor (hair, build, etc.) folded into the video prompt.' }
            backstory: { type: string }
          required: [name, age]
        seedImage:
          type: string
          description: Base64 image bytes, or a `data:<mime>;base64,<bytes>` URI (typically the output of /v1/companion/portrait).
        actionString:
          type: string
          description: 'Optional compact keyboard-schedule camera control, e.g. "w-10,a-10,d-10". Omit to have the server derive one from persona.personality instead (companion/action_string.ts) — never actually free-form by default.'
      required: [persona, seedImage]
    SceneResponse:
      type: object
      properties:
        video:
          type: string
          nullable: true
          description: A `data:<mimeType>;base64,<bytes>` URI, or null when unavailable.
        source:
          type: string
          description: The provider name on success (e.g. colab_tunnel), or "unavailable".
        model:
          type: string
          nullable: true
        error:
          type: string
          description: Present only when source is "unavailable" due to a real provider failure.
      required: [video, source]
    SpeakRequest:
      type: object
      properties:
        text:
          type: string
          description: 'Already-approved chat text to synthesize. Capped at MAX_MESSAGE_CHARS (4000 chars, same limit companion/chat applies to messages).'
        voice:
          type: string
          description: 'Optional named voice (Kokoro-82M ships several, e.g. "af_bella"). Omit to use the provider default.'
      required: [text]
    SpeakResponse:
      type: object
      properties:
        audio:
          type: string
          nullable: true
          description: A `data:<mimeType>;base64,<bytes>` URI (mimeType is audio/wav or audio/mpeg), or null when unavailable.
        source:
          type: string
          description: The provider name on success (e.g. kokoro_tunnel), or "unavailable".
        model:
          type: string
          nullable: true
        error:
          type: string
          description: Present only when source is "unavailable" due to a real provider failure.
      required: [audio, source]
    CreatorProfile:
      type: object
      description: >
        A creator's marketplace profile (creator/). Just an auth/ User plus this — no parallel
        identity system. verificationStatus starts 'unverified' and NOTHING in this build can
        ever set it to 'verified' — see the payout stub note on POST /v1/creator/payout.
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        bio: { type: string }
        verificationStatus:
          type: string
          enum: [unverified, pending, verified]
        createdAt:
          type: integer
          description: Epoch milliseconds.
      required: [userId, displayName, verificationStatus, createdAt]
    CreatorApplyRequest:
      type: object
      properties:
        displayName: { type: string }
        bio: { type: string }
      required: [displayName]
    CreatorPersona:
      type: object
      description: >
        A creator-submitted persona. `personaId` is the SAME id space as
        PortraitPersona.personaId / CompanionChatRequest.companionId / FuckLike's companion
        presetId — it is the join key usage-attribution keys off of.
      properties:
        id: { type: string, format: uuid }
        creatorUserId: { type: string, format: uuid }
        personaId:
          type: string
          maxLength: 80
          pattern: '^[A-Za-z0-9_-]+$'
        displayName: { type: string }
        description: { type: string }
        referencePhotoUrls:
          type: array
          items: { type: string, format: uri }
          description: URLs only — image bytes are never accepted or stored here.
        scanUrls:
          type: array
          items: { type: string, format: uri }
          description: >
            URLs only, same posture as referencePhotoUrls — a link to a 3D scan/model (e.g. a
            Polycam/RealityScan/in3D share link, or any hosted .glb/.usdz/.obj) or a
            multi-angle photo set. No file bytes are ever accepted or stored here.
        createdAt:
          type: integer
          description: Epoch milliseconds.
      required: [id, creatorUserId, personaId, displayName, referencePhotoUrls, scanUrls, createdAt]
    CreatorPersonaRequest:
      type: object
      properties:
        personaId:
          type: string
          maxLength: 80
          pattern: '^[A-Za-z0-9_-]+$'
        displayName: { type: string }
        description: { type: string }
        referencePhotoUrls:
          type: array
          items: { type: string, format: uri }
          description: Optional; defaults to []. http(s) URLs only.
        scanUrls:
          type: array
          items: { type: string, format: uri }
          description: >
            Optional; defaults to []. http(s) URLs only — a link to a 3D scan/model or
            multi-angle photo set, same posture as referencePhotoUrls.
      required: [personaId, displayName]
    CreatorEarningsResponse:
      type: object
      description: >
        `payoutAvailable` is ALWAYS false, REGARDLESS of whether real Stripe keys are
        configured: even when verificationStatus reads 'verified' here (a fast, LOCAL,
        webhook-updated cache — see POST /v1/creator/verification), POST /v1/creator/payout
        independently re-checks Stripe LIVE before ever moving money, so this flag is display
        guidance only, never a promise — it exists purely so a frontend can render a "payouts
        available" vs. "coming soon" state instead of inferring it from a 403.
      properties:
        accruedUsd:
          type: number
          description: Sum of every LikenessUsageEvent.accruedUsd recorded for this creator.
        verificationStatus:
          type: string
          enum: [unverified, pending, verified]
        payoutAvailable:
          type: boolean
          enum: [false]
      required: [accruedUsd, verificationStatus, payoutAvailable]
    CreatorVerificationSession:
      type: object
      description: >
        Two modes, selected server-side by whether STRIPE_SECRET_KEY + STRIPE_WEBHOOK_SECRET are
        configured (creator/payout_factory.ts): UNCONFIGURED (default) ⇒ a stub session
        (creator/payout_stub.ts), ALWAYS `requires_input` and never auto-completes — no real
        ID-check backend is wired. CONFIGURED ⇒ a REAL Stripe Identity VerificationSession +
        Stripe Connect Express onboarding link (creator/payout_stripe_live.ts) — `url` is where
        the client redirects the creator to actually complete both flows.
      properties:
        id: { type: string }
        status:
          type: string
          enum: [requires_input, processing, verified, rejected, canceled]
        livemode: { type: boolean }
        url: { type: string, format: uri }
        createdAt:
          type: integer
          description: Epoch milliseconds.
      required: [id, status, livemode, url, createdAt]
    CreatorPayoutRequest:
      type: object
      properties:
        amountUsd:
          type: number
          exclusiveMinimum: 0
      required: [amountUsd]
    AllowanceRequest:
      type: object
      properties:
        tier:
          type: string
          enum: [FREE, STARTER, PRO, ENTERPRISE, BYOK]
        includedAllowanceUsd: { type: number }
        hardCapUsd:
          type: number
          nullable: true
paths:
  /v1/intent:
    post:
      tags: [intent]
      summary: Submit a natural-language intent
      description: HOPE interprets + documents the utterance and submits it via APEX; KNOLL gates the route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentRequest'
      responses:
        '200':
          description: Interpreted and (when confident) routed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentResponse'
        '400':
          description: Missing or empty utterance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/health:
    get:
      tags: [health]
      summary: Resident-agent health and KNOLL gate state
      responses:
        '200':
          description: Health snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/health/deep:
    get:
      tags: [health]
      summary: Per-dependency reachability diagnostics (Postgres, Redis, LLM, image, video)
      description: >
        Distinct from GET /v1/health above: this endpoint makes real (bounded, parallel) network
        calls to whichever dependencies are configured — a Postgres `SELECT 1` when DATABASE_URL
        is set, a Redis TCP+PING when REDIS_URL is set, and a cheap reachability probe for the
        configured LLM/image/video providers (e.g. `GET {baseUrl}/models` for an
        `openai_compatible` provider such as Ollama, or `GET {baseUrl}/health` for a
        `colab_tunnel` provider). Unconfigured dependencies report `skipped: true` rather than a
        false failure. The whole call is bounded to a few seconds (checks run in parallel, each
        raced against a shared timeout) so it can never hang. PROTECTED — same posture as
        GET /v1/matrix/stats (requires the API key when one is configured); it is NOT rate-limit-
        or auth-exempt like GET /v1/health, since dependency topology is operational information.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every configured, non-skipped dependency is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDeepResponse'
        '503':
          description: At least one configured, non-skipped dependency is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDeepResponse'
        '401':
          description: Missing/invalid API key (when HDV_API_KEY is configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/metrics:
    get:
      tags: [metrics]
      summary: Observability snapshot
      description: Defaults to a JSON snapshot; pass `?format=prometheus` for exposition text.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, prometheus, text]
      responses:
        '200':
          description: Metrics snapshot (JSON) or Prometheus text.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
  /v1/billing/pricing:
    get:
      tags: [billing]
      summary: Public pricing table
      responses:
        '200':
          description: The marketing-ready pricing table.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/billing/usage:
    get:
      tags: [billing]
      summary: A tenant's balance, meter, and recent occurrences
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Usage snapshot for the tenant.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/billing/estimate:
    get:
      tags: [billing]
      summary: Cost estimate for a hypothetical unit of work
      description: Inputs may be provided as query params or a JSON body.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: activeParams
          in: query
          schema: { type: number }
        - name: durationSec
          in: query
          schema: { type: number }
        - name: model
          in: query
          schema: { type: string }
        - name: tier
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Estimate for the caller's tier plus a per-tier comparison.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid activeParams/durationSec/tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/billing/allowance:
    post:
      tags: [billing]
      summary: Set/adjust a tenant's allowance (admin/dev)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllowanceRequest'
      responses:
        '200':
          description: Updated balance.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid allowance input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/billing/checkout:
    post:
      tags: [billing]
      summary: Start a (stub) Stripe Checkout session for a plan tier
      description: >-
        Auth-exempt (public — FuckLike/web has no account system, only an anonymous per-browser
        tenant id). Rate-limited per-IP AND additively per-tenant (X-HDV-Tenant,
        HDV_TENANT_RATE_LIMIT). STUB by default (no STRIPE_SECRET_KEY): a fake, well-formed
        test-mode session with no real charge. Returns a hosted `url` to redirect to.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tier: { type: string, enum: [FREE, STARTER, PRO, ENTERPRISE, BYOK] }
                interval: { type: string, enum: [month, year], default: month }
                quantity: { type: integer, default: 1 }
                customerEmail: { type: string }
              required: [tier]
      responses:
        '200':
          description: Checkout session created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid tier/input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [billing]
      summary: Look up a (stub) checkout session by id
      description: Auth-exempt (public), same posture as POST.
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session found.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
