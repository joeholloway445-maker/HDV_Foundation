          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/login:
    post:
      tags: [auth]
      summary: Authenticate an existing account
      description: >-
        Auth-exempt (public) but rate-limited with the same stricter, dedicated per-IP cap as
        signup. An unknown email and a wrong password return the EXACT SAME 401 message
        ("invalid email or password") — this never reveals which, so a caller can't enumerate
        registered emails.
