openapi: 3.0.3
info:
  title: Big 5 Matrix (HDV Foundation) — HOPE Gateway API
  version: "0.8.0"
  description: >
    The public HTTP surface of the Big 5 Matrix. Every request enters through the HOPE gateway,
    is minted into a RoutingPacket by APEX, and is gated by KNOLL before any DREAM/VISION work
    runs. This document covers the main `/v1` routes. It is the contract the typed SDK
    (`@big5-matrix/sdk`) and the live HOPE app are built against. Clients import NO agent
    internals — they only speak HTTP to these routes.
  license:
    name: MIT
servers:
  - url: http://localhost:8787
    description: Local gateway (npm run gateway)
tags:
  - name: intent
  - name: health
  - name: metrics
  - name: billing
  - name: auth
  - name: waitlist
  - name: companion
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Optional API key sent as `Authorization: Bearer <token>`.
  parameters:
    TenantHeader:
      name: X-HDV-Tenant
      in: header
      required: false
      schema:
        type: string
      description: Tenant identifier for tenant-scoped routes (defaults to "demo").
    SessionHeader:
      name: X-HDV-Session
      in: header
      required: false
      schema:
        type: string
      description: >-
        Bearer session token minted by POST /v1/auth/signup or /v1/auth/login. Required (401
        otherwise) for GET /v1/auth/me; POST /v1/auth/logout also accepts it in a
        `{ sessionToken }` JSON body as a fallback.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    KnollVerdict:
      type: object
      properties:
        isAllowed:
          type: boolean
        reasoning:
          type: string
          nullable: true
        enforcedConstraints:
          type: array
          items:
            type: string
          description: >
            Public law/guard names, e.g. NO_DIRECT_DREAM_VISION, HASH_INTEGRITY, NO_CROSS_TENANT.
    IntentRequest:
      type: object
      properties:
        utterance:
          type: string
          description: The natural-language request to interpret and route.
      required: [utterance]
    IntentResponse:
      type: object
      properties:
        accepted:
          type: boolean
        dispatched:
          type: boolean
        clarificationNeeded:
          type: boolean
        routingStatus:
          type: string
          enum: [SUCCESS, BLOCKED, FAILED, HELD]
        knoll:
          allOf:
            - $ref: '#/components/schemas/KnollVerdict'
          nullable: true
        voice:
          type: string
        intent:
          type: object
          additionalProperties: true
        documentId:
          type: string
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        time:
          type: integer
          format: int64
        alwaysOn:
          type: array
          items:
            type: object
            properties:
              role: { type: string }
              lifecycle: { type: string }
              status: { type: string }
        ephemeral:
          type: array
          items:
            type: object
            properties:
              role: { type: string }
              lifecycle: { type: string }
              idle: { type: boolean }
              lastActiveAgoMs:
                type: integer
                nullable: true
        knollGate:
          type: string
    WaitlistSignupRequest:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: string }
        company: { type: string }
        interestedTier: { type: string }
        useCase: { type: string }
        source: { type: string }
        referral: { type: string }
      required: [email]
    WaitlistSignupResponse:
      type: object
      properties:
        created: { type: boolean }
        duplicate: { type: boolean }
        position: { type: integer }
        entry:
          type: object
          additionalProperties: true
    WaitlistStats:
      type: object
      properties:
        total: { type: integer }
        bySource:
          type: object
          additionalProperties: { type: integer }
        byTier:
          type: object
          additionalProperties: { type: integer }
        last24h: { type: integer }
        last7d: { type: integer }
        firstAt: { type: integer, nullable: true }
        lastAt: { type: integer, nullable: true }
    User:
      type: object
      description: Public-safe account view. NEVER includes passwordHash.
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
      required: [userId, email]
    AuthSignupRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 8
          description: Minimum 8 characters. No other complexity rules in this pass.
      required: [email, password]
    AuthLoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]
    AuthResponse:
      type: object
      description: Returned by both signup and login. Never includes the password or its hash.
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        sessionToken:
          type: string
          description: Opaque bearer token — send back via the X-HDV-Session header.
      required: [userId, email, sessionToken]
    AuthLogoutRequest:
      type: object
      description: Optional fallback body when the X-HDV-Session header isn't used.
      properties:
        sessionToken: { type: string }
    CompanionPersona:
      type: object
      properties:
        name: { type: string }
        age:
          type: integer
          minimum: 18
          description: Required. Chat is refused (400) for any persona under 18, regardless of provider.
        personality:
          type: string
          enum: [playful, romantic, bratty, dominant, soft, mysterious]
        backstory: { type: string }
        intensity:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: How explicit/raunchy replies may get, 1 (sweet/PG) to 5 (maximally explicit). Clamped; malformed values default to 3.
        adherence:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: How strictly replies stick to the character sheet, 1 (loose improvisation) to 5 (strict script). Also drives LLM sampling temperature. Clamped; malformed values default to 3.
      required: [name, age]
    CompanionChatMessage:
      type: object
      properties:
        role: { type: string, enum: [user, bot] }
        text: { type: string }
      required: [role, text]
    CompanionChatRequest:
      type: object
      properties:
        persona:
          $ref: '#/components/schemas/CompanionPersona'
        history:
          type: array
          items:
            $ref: '#/components/schemas/CompanionChatMessage'
          description: Trimmed transcript so far (last ~20 turns). Stateless — sent every call.
        message:
          type: string
        companionId:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: >
            Optional, ENTIRELY OPT-IN. An opaque, client-generated stable id for "which saved
            companion is this" — NOT a real user id (there is no user-account system yet).
            Alphanumeric plus "_"/"-" only. When present AND persistent memory is available
            server-side, the companion's remembered relationship state (see CompanionMemory) is
            folded into the reply and updated afterward. Omitted ⇒ chat is fully stateless, byte-
            for-byte identical to calling this endpoint with no memory feature at all.
      required: [persona, message]
    CompanionChatResponse:
      type: object
      properties:
        reply:
          type: string
        source:
          type: string
          enum: [llm, fallback]
          description: llm when HDV_LLM_PROVIDER produced the reply; fallback when it was canned.
        model:
          type: string
          nullable: true
      required: [reply, source]
    CompanionMemory:
      type: object
      description: >
        Opt-in companion relationship memory (companion/memory.ts). One row per companionId.
        Never 404s from GET /v1/companion/memory — an unknown companionId simply returns these
        defaults (affectionLevel 50, empty summary, turnCount 0).
      properties:
        companionId:
          type: string
        affectionLevel:
          type: integer
          minimum: 0
          maximum: 100
          default: 50
        summary:
          type: string
          description: Running relationship/fact summary, length-capped.
        turnCount:
          type: integer
          default: 0
        updatedAt:
          type: integer
          description: Epoch milliseconds.
      required: [companionId, affectionLevel, summary, turnCount, updatedAt]
    PortraitPersona:
      type: object
      properties:
        name: { type: string }
        age:
          type: integer
          minimum: 18
          description: Required. Portraits are refused (400) for any persona under 18, regardless of provider.
        style: { type: string, description: 'Free-form visual style, e.g. "realistic" or "anime".' }
        personality:
          type: string
          enum: [playful, romantic, bratty, dominant, soft, mysterious]
        appearance: { type: string, description: 'Optional physical-appearance descriptor (hair, build, etc.) folded into the image prompt.' }
        backstory: { type: string }
      required: [name, age]
    PortraitRequest:
      type: object
      properties:
        persona:
          $ref: '#/components/schemas/PortraitPersona'
      required: [persona]
    PortraitResponse:
      type: object
      properties:
        image:
          type: string
          nullable: true
          description: A `data:<mimeType>;base64,<bytes>` URI, or null when unavailable.
        source:
          type: string
          description: The provider name on success (e.g. google_ai_studio, colab_tunnel), or "unavailable".
        model:
          type: string
          nullable: true
        error:
          type: string
          description: Present only when source is "unavailable" due to a real provider failure.
      required: [image, source]
    SceneRequest:
      type: object
      properties:
        persona:
          type: object
          properties:
            name: { type: string }
            age:
              type: integer
              minimum: 18
              description: Required. Scenes are refused (400) for any persona under 18, regardless of provider.
            personality:
              type: string
              enum: [playful, romantic, bratty, dominant, soft, mysterious]
            appearance: { type: string, description: 'Optional physical-appearance descriptor (hair, build, etc.) folded into the video prompt.' }
            backstory: { type: string }
          required: [name, age]
        seedImage:
          type: string
          description: Base64 image bytes, or a `data:<mime>;base64,<bytes>` URI (typically the output of /v1/companion/portrait).
        actionString:
          type: string
          description: 'Optional compact keyboard-schedule camera control, e.g. "w-10,a-10,d-10". Omit to have the server derive one from persona.personality instead (companion/action_string.ts) — never actually free-form by default.'
      required: [persona, seedImage]
    SceneResponse:
      type: object
      properties:
        video:
          type: string
          nullable: true
          description: A `data:<mimeType>;base64,<bytes>` URI, or null when unavailable.
        source:
          type: string
          description: The provider name on success (e.g. colab_tunnel), or "unavailable".
        model:
          type: string
          nullable: true
        error:
          type: string
          description: Present only when source is "unavailable" due to a real provider failure.
      required: [video, source]
    SpeakRequest:
      type: object
      properties:
        text:
          type: string
          description: 'Already-approved chat text to synthesize. Capped at MAX_MESSAGE_CHARS (4000 chars, same limit companion/chat applies to messages).'
        voice:
          type: string
          description: 'Optional named voice (Kokoro-82M ships several, e.g. "af_bella"). Omit to use the provider default.'
      required: [text]
    SpeakResponse:
      type: object
      properties:
        audio:
          type: string
          nullable: true
          description: A `data:<mimeType>;base64,<bytes>` URI (mimeType is audio/wav or audio/mpeg), or null when unavailable.
        source:
          type: string
          description: The provider name on success (e.g. kokoro_tunnel), or "unavailable".
        model:
          type: string
          nullable: true
        error:
          type: string
          description: Present only when source is "unavailable" due to a real provider failure.
      required: [audio, source]
    AllowanceRequest:
      type: object
      properties:
        tier:
          type: string
          enum: [FREE, STARTER, PRO, ENTERPRISE, BYOK]
        includedAllowanceUsd: { type: number }
        hardCapUsd:
          type: number
          nullable: true
paths:
  /v1/intent:
    post:
      tags: [intent]
      summary: Submit a natural-language intent
      description: HOPE interprets + documents the utterance and submits it via APEX; KNOLL gates the route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentRequest'
      responses:
        '200':
          description: Interpreted and (when confident) routed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentResponse'
        '400':
          description: Missing or empty utterance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/health:
    get:
      tags: [health]
      summary: Resident-agent health and KNOLL gate state
      responses:
        '200':
          description: Health snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/metrics:
    get:
      tags: [metrics]
      summary: Observability snapshot
      description: Defaults to a JSON snapshot; pass `?format=prometheus` for exposition text.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, prometheus, text]
      responses:
        '200':
          description: Metrics snapshot (JSON) or Prometheus text.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
  /v1/billing/pricing:
    get:
      tags: [billing]
      summary: Public pricing table
      responses:
        '200':
          description: The marketing-ready pricing table.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/billing/usage:
    get:
      tags: [billing]
      summary: A tenant's balance, meter, and recent occurrences
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Usage snapshot for the tenant.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/billing/estimate:
    get:
      tags: [billing]
      summary: Cost estimate for a hypothetical unit of work
      description: Inputs may be provided as query params or a JSON body.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: activeParams
          in: query
          schema: { type: number }
        - name: durationSec
          in: query
          schema: { type: number }
        - name: model
          in: query
          schema: { type: string }
        - name: tier
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Estimate for the caller's tier plus a per-tier comparison.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid activeParams/durationSec/tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/billing/allowance:
    post:
      tags: [billing]
      summary: Set/adjust a tenant's allowance (admin/dev)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllowanceRequest'
      responses:
        '200':
          description: Updated balance.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid allowance input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/billing/checkout:
    post:
      tags: [billing]
      summary: Start a (stub) Stripe Checkout session for a plan tier
      description: >-
        Auth-exempt (public — FuckLike/web has no account system, only an anonymous per-browser
        tenant id). STUB by default (no STRIPE_SECRET_KEY): a fake, well-formed test-mode
        session with no real charge. Returns a hosted `url` to redirect to.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tier: { type: string, enum: [FREE, STARTER, PRO, ENTERPRISE, BYOK] }
                interval: { type: string, enum: [month, year], default: month }
                quantity: { type: integer, default: 1 }
                customerEmail: { type: string }
              required: [tier]
      responses:
        '200':
          description: Checkout session created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid tier/input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [billing]
      summary: Look up a (stub) checkout session by id
      description: Auth-exempt (public), same posture as POST.
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session found.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Unknown or expired session_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/billing/checkout/settle:
    post:
      tags: [billing]
      summary: TEST-MODE ONLY — simulate checkout completion and upgrade the tenant's tier
      description: >-
        Auth-exempt (public) today because it's a stub with no real payment behind it. Stands in
        for what a real, signature-verified Stripe `checkout.session.completed` webhook would
        do. MUST be locked down / replaced before a live STRIPE_SECRET_KEY is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string }
              required: [sessionId]
      responses:
        '200':
          description: Session settled (or already expired — check `ok`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Unknown or expired sessionId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/signup:
    post:
      tags: [auth]
      summary: Create a new email+password account
      description: >-
        Auth-exempt (public — this route IS the auth system) but rate-limited, with a stricter,
        dedicated per-IP cap on top of the generic gateway limiter (brute-force defense; see
        HDV_AUTH_RATE_LIMIT in gateway/middleware.ts). NOT wired into billing/checkout's
        X-HDV-Tenant resolution yet — see the TODO in gateway/server.ts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSignupRequest'
      responses:
        '200':
          description: Account created; a fresh session token is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing fields, malformed email, or a password under 8 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: An account with that email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Signup-specific rate limit exceeded for this IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/login:
    post:
      tags: [auth]
      summary: Authenticate an existing account
      description: >-
        Auth-exempt (public) but rate-limited with the same stricter, dedicated per-IP cap as
        signup. An unknown email and a wrong password return the EXACT SAME 401 message
        ("invalid email or password") — this never reveals which, so a caller can't enumerate
        registered emails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Authenticated; a fresh session token is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing/malformed email or password fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid email or password (identical message either way).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Login-specific rate limit exceeded for this IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Invalidate a session token
      description: Auth-exempt (public — authenticates via its OWN session token, not HDV_API_KEY). Idempotent — always 200, even for an unknown/already-expired token.
      parameters:
        - $ref: '#/components/parameters/SessionHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogoutRequest'
      responses:
        '200':
          description: Session invalidated (or was already invalid — always ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
  /v1/auth/me:
    get:
      tags: [auth]
      summary: Resolve the current session to its account
      description: Auth-exempt (public — authenticates via its OWN session token, not HDV_API_KEY).
      parameters:
        - $ref: '#/components/parameters/SessionHeader'
      responses:
        '200':
          description: The account for a valid, unexpired session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing, invalid, or expired session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/waitlist:
    post:
      tags: [waitlist]
      summary: Public waitlist signup (idempotent by email)
      description: Auth-exempt but rate-limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistSignupRequest'
      responses:
        '200':
          description: Signup recorded (or idempotent re-signup).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistSignupResponse'
        '400':
          description: Invalid signup (e.g. malformed email).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/waitlist/stats:
    get:
      tags: [waitlist]
      summary: Privacy-safe aggregate signup stats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aggregate counts (no PII).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistStats'
  /v1/companion/chat:
    post:
      tags: [companion]
      summary: One in-character companion reply
      description: >
        Auth-exempt but rate-limited (the web client calls this directly, with no API key).
        Stateless by default: the client sends the persona + trimmed history on every call.
        Optionally supply `companionId` to opt into persistent relationship memory (see
        CompanionChatRequest.companionId and GET /v1/companion/memory) — omit it and behavior
        is unchanged. Never routes through APEX/KNOLL — it only calls the configured
        LlmProvider (or a deterministic per-personality fallback when none is configured / it
        fails).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanionChatRequest'
      responses:
        '200':
          description: Reply generated (llm or fallback source).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionChatResponse'
        '400':
          description: Invalid request (e.g. missing persona.name or empty message).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/companion/chat/stream:
    post:
      tags: [companion]
      summary: One in-character companion reply, streamed token-by-token (SSE)
      description: >
        The streaming twin of POST /v1/companion/chat: identical request body, identical
        validation (including the 18+ floor — a rejected persona gets a normal buffered 400
        JSON error, exactly like the non-streaming route, BEFORE any event-stream framing is
        written), and the same auth-exempt-but-rate-limited posture. The only difference is
        delivery: the response is `text/event-stream` instead of one buffered JSON object.

        OpenAPI 3.0 has no native SSE modeling, so the event shape is documented here instead
        of as a schema. On success (200) the body is a sequence of `text/event-stream` frames,
        each `data: <json>\n\n`:
          - zero or more `{"delta": "<next chunk of text>"}` frames, in order — concatenating
            every `delta` reconstructs the full reply (mirrors CompanionChatResponse.reply);
          - exactly one final `{"done": true, "source": "llm"|"fallback", "model": string|null,
            "error"?: string}` frame, then the connection closes.
        When the configured LlmProvider implements streaming, real deltas are forwarded as the
        model produces them. When there is no provider, the provider is the offline stub, or the
        configured provider doesn't implement streaming, the SAME deterministic per-personality
        fallback text POST /v1/companion/chat would have returned is sent as a single `delta`
        frame followed by `done` — the SSE contract never changes shape based on what's
        configured server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanionChatRequest'
      responses:
        '200':
          description: >
            SSE stream established. Body is `text/event-stream`: see the description above for
            the frame shapes (`delta` chunks followed by one `done` frame).
          content:
            text/event-stream:
              schema:
                type: string
                description: 'Raw SSE bytes: repeated `data: {"delta":"..."}\n\n` frames, then one `data: {"done":true,...}\n\n` frame.'
        '400':
          description: Invalid request (e.g. missing persona.name, empty message, or persona.age < 18). No SSE framing is written — this is a normal buffered JSON error, same as POST /v1/companion/chat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/companion/portrait:
    post:
      tags: [companion]
      summary: One companion portrait image
      description: >
        Auth-exempt but rate-limited, same posture as /v1/companion/chat. Provider-agnostic —
        HDV_IMAGE_PROVIDER selects Google AI Studio (SFW) or a self-hosted Colab-tunnel model
        with no client changes. Refuses (400) any persona under 18, regardless of provider.
        Never routes through APEX/KNOLL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortraitRequest'
      responses:
        '200':
          description: Generation attempted — image on success, null + source "unavailable" otherwise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortraitResponse'
        '400':
          description: Invalid request (missing persona.name/age, or persona.age < 18).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/companion/scene:
    post:
      tags: [companion]
      summary: Animate a companion portrait into a short scene/loop video
      description: >
        Auth-exempt but rate-limited, same posture as chat/portrait. Provider-agnostic —
        HDV_VIDEO_PROVIDER selects a Colab-tunneled world model (e.g. LingBot-World). Refuses
        (400) any persona under 18, regardless of provider. Never routes through APEX/KNOLL.
        Video generation is slow (minutes, not seconds) — this is meant for generate-once,
        cache-and-loop client-side, not live per-message calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneRequest'
      responses:
        '200':
          description: Generation attempted — video on success, null + source "unavailable" otherwise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneResponse'
        '400':
          description: Invalid request (missing persona.name/age/seedImage, or persona.age < 18).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/companion/memory:
    get:
      tags: [companion]
      summary: Read a companion's remembered relationship state
      description: >
        Auth-exempt but rate-limited, same posture as chat/portrait/scene. Read-only —
        never routes through APEX/KNOLL. Backed by an in-memory store by default, or Postgres
        (via Prisma) when DATABASE_URL is set — see persistence/repositories.ts's
        CompanionMemoryRepository. Never 404s: an unknown/never-seen companionId returns
        fresh defaults so a frontend can render a "relationship level" UI immediately.
      parameters:
        - name: companionId
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: The companion's memory record (existing or default).
          content:
            application/json:
              schema:
                type: object
                properties:
                  memory:
                    $ref: '#/components/schemas/CompanionMemory'
                required: [memory]
        '400':
          description: Missing companionId query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/companion/speak:
    post:
      tags: [companion]
      summary: Synthesize speech audio for one line of text
      description: >
        Auth-exempt but rate-limited, same posture as chat/portrait/scene. Provider-agnostic —
        HDV_TTS_PROVIDER selects a self-hosted Kokoro-82M server (kokoro_tunnel). Unlike
        portrait/scene there is no persona/age-floor check here: this only converts text the
        client already has (already-approved chat output) into audio rather than generating new
        content about a character, so the 18+ floor is enforced upstream, at the text's origin.
        Never routes through APEX/KNOLL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeakRequest'
      responses:
        '200':
          description: Generation attempted — audio on success, null + source "unavailable" otherwise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakResponse'
        '400':
          description: Invalid request (missing/empty text, or text over the length cap).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
