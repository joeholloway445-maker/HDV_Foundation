            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Login-specific rate limit exceeded for this IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/logout:
