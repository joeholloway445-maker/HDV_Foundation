  /v1/companion/chat:
    post:
      tags: [companion]
      summary: One in-character companion reply
      description: >
        Auth-exempt but rate-limited (the web client calls this directly, with no API key).
        TWO rate limits apply, additively: the always-on per-IP limit (HDV_RATE_LIMIT), plus a
        per-tenant limit keyed by X-HDV-Tenant (HDV_TENANT_RATE_LIMIT, default 20/min) so many
        tenants sharing one shared-VPS/NAT IP each get their own budget. Either can 429
        independently — the response body's `error` field distinguishes "rate limit exceeded"
        (per-IP) from "tenant rate limit exceeded" (per-tenant, includes `tenantId`). Stateless
        by default: the client sends the persona + trimmed history on every call. Optionally
        supply `companionId` to opt into persistent relationship memory (see
        CompanionChatRequest.companionId and GET /v1/companion/memory) — omit it and behavior
        is unchanged. Never routes through APEX/KNOLL — it only calls the configured
        LlmProvider (or a deterministic per-personality fallback when none is configured / it
        fails).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanionChatRequest'
      responses:
        '200':
          description: Reply generated (llm or fallback source).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionChatResponse'
        '400':
          description: Invalid request (e.g. missing persona.name or empty message).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/companion/chat/stream:
    post:
      tags: [companion]
      summary: One in-character companion reply, streamed token-by-token (SSE)
      description: >
        The streaming twin of POST /v1/companion/chat: identical request body, identical
        validation (including the 18+ floor — a rejected persona gets a normal buffered 400
        JSON error, exactly like the non-streaming route, BEFORE any event-stream framing is
        written), and the same auth-exempt-but-rate-limited posture. The only difference is
        delivery: the response is `text/event-stream` instead of one buffered JSON object.

        OpenAPI 3.0 has no native SSE modeling, so the event shape is documented here instead
        of as a schema. On success (200) the body is a sequence of `text/event-stream` frames,
        each `data: <json>\n\n`:
          - zero or more `{"delta": "<next chunk of text>"}` frames, in order — concatenating
            every `delta` reconstructs the full reply (mirrors CompanionChatResponse.reply);
          - exactly one final `{"done": true, "source": "llm"|"fallback", "model": string|null,
            "error"?: string}` frame, then the connection closes.
        When the configured LlmProvider implements streaming, real deltas are forwarded as the
        model produces them. When there is no provider, the provider is the offline stub, or the
        configured provider doesn't implement streaming, the SAME deterministic per-personality
        fallback text POST /v1/companion/chat would have returned is sent as a single `delta`
        frame followed by `done` — the SSE contract never changes shape based on what's
        configured server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanionChatRequest'
      responses:
        '200':
          description: >
            SSE stream established. Body is `text/event-stream`: see the description above for
            the frame shapes (`delta` chunks followed by one `done` frame).
          content:
            text/event-stream:
              schema:
                type: string
                description: 'Raw SSE bytes: repeated `data: {"delta":"..."}\n\n` frames, then one `data: {"done":true,...}\n\n` frame.'
        '400':
          description: Invalid request (e.g. missing persona.name, empty message, or persona.age < 18). No SSE framing is written — this is a normal buffered JSON error, same as POST /v1/companion/chat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/companion/portrait:
    post:
      tags: [companion]
      summary: One companion portrait image
      description: >
        Auth-exempt but rate-limited (per-IP AND additively per-tenant, same posture as
        /v1/companion/chat). Provider-agnostic —
        HDV_IMAGE_PROVIDER selects Google AI Studio (SFW) or a self-hosted Colab-tunnel model
        with no client changes. Refuses (400) any persona under 18, regardless of provider.
        Never routes through APEX/KNOLL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortraitRequest'
      responses:
        '200':
          description: Generation attempted — image on success, null + source "unavailable" otherwise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortraitResponse'
        '400':
          description: Invalid request (missing persona.name/age, or persona.age < 18).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/companion/scene:
    post:
      tags: [companion]
      summary: Animate a companion portrait into a short scene/loop video
      description: >
        Auth-exempt but rate-limited (per-IP AND additively per-tenant, same posture as
        chat/portrait). Provider-agnostic —
        HDV_VIDEO_PROVIDER selects a Colab-tunneled world model (e.g. LingBot-World). Refuses
        (400) any persona under 18, regardless of provider. Never routes through APEX/KNOLL.
        Video generation is slow (minutes, not seconds) — this is meant for generate-once,
        cache-and-loop client-side, not live per-message calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneRequest'
      responses:
        '200':
          description: Generation attempted — video on success, null + source "unavailable" otherwise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneResponse'
        '400':
          description: Invalid request (missing persona.name/age/seedImage, or persona.age < 18).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/companion/memory:
    get:
      tags: [companion]
      summary: Read a companion's remembered relationship state
      description: >
        Auth-exempt but rate-limited, same posture as chat/portrait/scene. Read-only —
        never routes through APEX/KNOLL. Backed by an in-memory store by default, or Postgres
        (via Prisma) when DATABASE_URL is set — see persistence/repositories.ts's
        CompanionMemoryRepository. Never 404s: an unknown/never-seen companionId returns
        fresh defaults so a frontend can render a "relationship level" UI immediately.
      parameters:
        - name: companionId
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: The companion's memory record (existing or default).
          content:
            application/json:
              schema:
                type: object
                properties:
                  memory:
                    $ref: '#/components/schemas/CompanionMemory'
                required: [memory]
        '400':
          description: Missing companionId query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/companion/speak:
    post:
      tags: [companion]
      summary: Synthesize speech audio for one line of text
      description: >
        Auth-exempt but rate-limited, same posture as chat/portrait/scene. Provider-agnostic —
        HDV_TTS_PROVIDER selects a self-hosted Kokoro-82M server (kokoro_tunnel). Unlike
        portrait/scene there is no persona/age-floor check here: this only converts text the
        client already has (already-approved chat output) into audio rather than generating new
        content about a character, so the 18+ floor is enforced upstream, at the text's origin.
        Never routes through APEX/KNOLL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeakRequest'
      responses:
        '200':
          description: Generation attempted — audio on success, null + source "unavailable" otherwise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakResponse'
        '400':
          description: Invalid request (missing/empty text, or text over the length cap).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/creator/apply:
    post:
      tags: [creator]
      summary: Become (or update) a creator
      description: >
        Backs the fucklike.me pivot: real people can turn themselves into an AI companion
        persona and earn when it's used. A creator is just the authenticated auth/ User plus a
        CreatorProfile — NOT a parallel identity system. Idempotent upsert keyed on the
        authenticated userId; `verificationStatus` is preserved across re-applications (starts
        'unverified' for a brand-new profile) and is NEVER set by this route. REQUIRES a valid
        X-HDV-Session (401 otherwise) — UNLIKE most companion/ routes, this is also NOT exempt
        from `bearerAuth` (the operator's HDV_API_KEY) when one is configured.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatorApplyRequest'
      responses:
        '200':
          description: The creator's profile (created or updated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/CreatorProfile'
                required: [profile]
        '400':
          description: Invalid request (missing/empty displayName).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired X-HDV-Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/creator/persona:
    post:
      tags: [creator]
      summary: Submit or update a creator persona
      description: >
        `personaId` is the join key (SAME id space as PortraitPersona.personaId /
        CompanionChatRequest.companionId) that attributes a chat/portrait/scene generation back
        to this creator — see recordLikenessUsage in creator/handlers.ts. Re-submitting the same
        creator's own personaId updates it in place; a personaId already claimed by a DIFFERENT
        creator is rejected with 409. REQUIRES a valid X-HDV-Session (401 otherwise); also NOT
        auth-exempt from `bearerAuth` when an operator API key is configured.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatorPersonaRequest'
      responses:
        '200':
          description: The persona (created or updated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  persona:
                    $ref: '#/components/schemas/CreatorPersona'
                required: [persona]
        '400':
          description: Invalid request (missing/malformed personaId or displayName, or a non-http(s) referencePhotoUrls entry).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired X-HDV-Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: personaId is already claimed by a different creator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/creator/earnings:
    get:
      tags: [creator]
      summary: Accrued balance + verification status
      description: >
        Sums every LikenessUsageEvent recorded for the authenticated creator. `payoutAvailable`
        is ALWAYS false in this build — see CreatorEarningsResponse and POST /v1/creator/payout.
        REQUIRES a valid X-HDV-Session (401 otherwise); also NOT auth-exempt from `bearerAuth`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionHeader'
      responses:
        '200':
          description: The creator's accrued earnings and verification status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorEarningsResponse'
        '401':
          description: Missing, invalid, or expired X-HDV-Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/creator/verification:
    post:
      tags: [creator]
      summary: Start the identity-verification + Connect-onboarding flow
      description: >
        Thin wrapper over the configured CreatorPayoutProvider's requestVerification
        (creator/payout_factory.ts selects the implementation). UNCONFIGURED (default, no real
        Stripe keys): always returns a session stuck in `requires_input` — a creator's status can
        never progress to `verified` through this build. CONFIGURED (STRIPE_SECRET_KEY +
        STRIPE_WEBHOOK_SECRET both set): creates a real Stripe Identity VerificationSession and
        Stripe Connect Express account, and `verified` only ever happens via a genuine,
        signature-verified Stripe webhook event (POST /v1/creator/webhooks/stripe) — never through
        this route directly. REQUIRES a valid X-HDV-Session (401 otherwise); also NOT auth-exempt
        from `bearerAuth`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionHeader'
      responses:
        '200':
          description: A stub verification session (always requires_input).
          content:
            application/json:
              schema:
                type: object
                properties:
                  verification:
                    $ref: '#/components/schemas/CreatorVerificationSession'
                required: [verification]
        '401':
          description: Missing, invalid, or expired X-HDV-Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/creator/payout:
    post:
      tags: [creator]
      summary: Request a payout
      description: >
        Two modes (creator/payout_factory.ts selects the implementation from
        STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET):

        UNCONFIGURED (default): THIS ALWAYS RETURNS 403. That is correct, expected behavior —
        see creator/payout_stub.ts's module doc comment. No creator's verificationStatus can
        ever reach 'verified' through the stub, so requestPayout is unconditionally blocked by
        construction, not by a runtime check that could accidentally be satisfied.

        CONFIGURED (creator/payout_stripe_live.ts): before ever moving money, the server
        re-verifies LIVE, directly against Stripe's own API (never a local cache), that the
        creator's Identity VerificationSession is genuinely `verified` AND their Connect account
        has `payouts_enabled`. Only if BOTH are true at the moment of this call does a real
        Stripe transfer happen; otherwise this still returns 403. This live recheck means a bug
        in the webhook/cache-update path can never by itself let an unverified creator get paid.

        Earnings always accrue (GET /v1/creator/earnings) regardless of mode. REQUIRES a valid
        X-HDV-Session (401 otherwise); also NOT auth-exempt from `bearerAuth`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatorPayoutRequest'
      responses:
        '400':
          description: Invalid/missing amountUsd.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired X-HDV-Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >-
            Payout blocked. UNCONFIGURED build: always returned (see creator/payout_stub.ts).
            CONFIGURED build: returned when the LIVE Stripe recheck fails (not verified, or
            payouts_enabled is false), regardless of what the local cache says.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/creator/webhooks/stripe:
    post:
      tags: [creator]
      summary: Stripe webhook — Identity + Connect events (Stripe calls this, not clients)
      description: >
        Receives `identity.verification_session.*` and `account.updated` events from Stripe
        (creator/stripe_webhook.ts). *** NOT authenticated by X-HDV-Session or HDV_API_KEY — this
        route cannot require either, since Stripe itself is the caller and cannot present them.
        Its ENTIRE security boundary is the `stripe-signature` header, verified via the Stripe
        SDK's own `stripe.webhooks.constructEvent()` before a single field of the body is
        trusted; an invalid/missing/forged signature is rejected with 400. This is NOT a
        precedent for other unauthenticated routes — see gateway/middleware.ts's
        AUTH_EXEMPT_PATHS comment. *** Returns 503 (not a crash) when Stripe hasn't been
        configured on this server (no STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET). Configure this
        exact URL as the endpoint in the Stripe dashboard — see deploy/STRIPE_CONNECT_SETUP.md.
        Unhandled event types are a safe 200 no-op, never an error.
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema:
            type: string
          description: Stripe's HMAC signature over the raw request body. Verified server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A raw Stripe Event payload. The body is read as RAW bytes (not JSON-parsed by the gateway) so the signature can be verified against the exact bytes Stripe sent.
      responses:
        '200':
          description: Signature verified; event processed (or safely no-op'd for an unhandled type).
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  type: { type: string }
        '400':
          description: Missing, invalid, or forged stripe-signature — nothing in the body was trusted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Stripe is not configured on this server (no live payout provider to verify against).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
